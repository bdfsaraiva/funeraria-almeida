# Publica a pré-visualização (não indexável) no GitHub Pages a cada push para main.
# Ativar uma vez em: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Pré-visualização (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar pré-visualização
        run: |
          REPO="${{ github.event.repository.name }}"
          case "$REPO" in
            *.github.io) export PREVIEW_BASE="" ;;
            *) export PREVIEW_BASE="/$REPO" ;;
          esac
          npm run build:preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
